name: LabsCode portable build

on:
  workflow_dispatch:
  push:
    branches: [lite]
    paths: ['lite/**', 'full/**', 'extensions/labscode-extras/**', 'build/**', 'product.json', '.github/workflows/lite-build.yml']

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=8192
  # Upstream's Linux toolchain setup (setup-env.sh) and native module builds read these.
  VSCODE_ARCH: x64
  npm_config_arch: x64

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        edition: [lite, full]
        include:
          - os: windows-latest
            target: win32-x64
            launcher: labscode.bat
          - os: ubuntu-24.04
            target: linux-x64
            launcher: labscode.sh
          # Lite: no Copilot, test fixtures, tunnels or LabsCode Extras.
          - edition: lite
            package: LabsCode-Lite
            name_long: LabsCode Lite
            strip: copilot vscode-api-tests vscode-colorize-tests vscode-colorize-perf-tests vscode-test-resolver tunnel-forwarding labscode-extras
          # Full: everything upstream ships, plus LabsCode Extras (themes and features).
          # Copilot is stripped here too: local builds can't package its SDK, so it wouldn't run.
          - edition: full
            package: LabsCode
            name_long: LabsCode
            strip: copilot vscode-api-tests vscode-colorize-tests vscode-colorize-perf-tests vscode-test-resolver
    name: build (${{ matrix.edition }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-0 libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev libgbm1

      - name: Install build tool dependencies
        shell: bash
        working-directory: build
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          # Upstream's toolchain setup (sysroot/compiler flags) for native modules on Linux
          if [ "$RUNNER_OS" = "Linux" ]; then source ./build/azure-pipelines/linux/setup-env.sh; fi
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set product name
        shell: bash
        run: node -e "const f='product.json',p=JSON.parse(require('fs').readFileSync(f));p.nameLong='${{ matrix.name_long }}';require('fs').writeFileSync(f,JSON.stringify(p,null,'\t'))"

      - name: Build
        shell: bash
        run: npm run gulp vscode-${{ matrix.target }}-min
        env:
          # Built-in extensions (js-debug etc.) are fetched from the GitHub API; unauthenticated calls hit the rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Unwanted extensions are removed from the packaged app after the build: the gulp
      # build lists extension sources explicitly, so deleting them beforehand breaks it.
      - name: Assemble portable folder
        shell: bash
        run: |
          set -e
          mkdir -p dist
          mv ../VSCode-${{ matrix.target }} dist/LabsCode
          for e in ${{ matrix.strip }}; do rm -rf "dist/LabsCode/resources/app/extensions/$e"; done
          mkdir -p dist/LabsCode/data/user-data/User dist/LabsCode/data/extensions
          cp ${{ matrix.edition }}/settings.json dist/LabsCode/data/user-data/User/settings.json
          cp lite/${{ matrix.launcher }} dist/
          if [ "$RUNNER_OS" = "Windows" ]; then cp lite/install-deps.bat dist/; fi
          chmod +x dist/*.sh 2>/dev/null || true

      # Claude Code is published as one build per platform. /latest without a platform returns
      # the Linux build, which the Windows zip then shipped ("the installed extension holds the
      # Linux build instead"), so ask for this leg's target and check what came back.
      - name: Bundle Claude Code extension (from Open VSX)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          url=$(curl -fsSL "https://open-vsx.org/api/anthropic/claude-code/$TARGET/latest" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.targetPlatform!==process.env.TARGET){console.error('Open VSX returned the '+j.targetPlatform+' build of Claude Code, not '+process.env.TARGET);process.exit(1)}console.log(j.files.download)})")
          curl -fsSL "$url" -o claude-code.vsix
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/LabsCode/bin/code-oss.cmd --install-extension claude-code.vsix --extensions-dir dist/LabsCode/data/extensions
          else
            ./dist/LabsCode/bin/code-oss --install-extension claude-code.vsix --extensions-dir dist/LabsCode/data/extensions
          fi
          # The installed folder is named anthropic.claude-code-<version>-<platform>.
          ls dist/LabsCode/data/extensions
          if ls dist/LabsCode/data/extensions | grep '^anthropic\.claude-code-' | grep -qv -- "-$TARGET\$"; then
            echo "Claude Code for a platform other than $TARGET ended up in the package" >&2
            exit 1
          fi
          ls dist/LabsCode/data/extensions | grep -q -- "^anthropic\.claude-code-.*-$TARGET\$"

      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip ../${{ matrix.package }}-${{ matrix.target }}.zip .
          else
            tar -czf ../${{ matrix.package }}-${{ matrix.target }}.tar.gz .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: ${{ matrix.package }}-${{ matrix.target }}.*

  release:
    needs: build
    # Publish whichever editions built; one failing leg doesn't hold back the rest.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: labscode-beta-${{ github.run_number }}
          name: LabsCode beta ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Beta builds. Extract anywhere and run the launcher; settings and extensions stay in the folder.
            - **LabsCode**: light red LabsCode Light/Dark themes (follow the system setting), focus timer, today's edit tally, scratchpad and red-pen TODO markers.
            - **LabsCode Lite**: no telemetry, updates or extras.
            Neither edition includes the built-in Copilot. Both bundle the Claude Code extension.
          files: out/*
          fail_on_unmatched_files: true
